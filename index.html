function loadStorage(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function saveStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─── WORKOUT / SESSION TIMER LOGIC ───────────────────────────────────────────
function startSessionTimer() {
  if (state.sessionInterval) clearInterval(state.sessionInterval);
  state.sessionActive = true;
  state.sessionSeconds = 0;
  state.sessionInterval = setInterval(() => {
    state.sessionSeconds++;
    render();
  }, 1000);
  render();
}

function stopSessionTimer() {
  if (state.sessionInterval) clearInterval(state.sessionInterval);
  state.sessionActive = false;
  const mins = Math.floor(state.sessionSeconds / 60);
  const plan = WEEK_PLAN[state.trainingDay];
  
  // Log entry hinzufügen
  const logEntry = {
    date: today,
    text: `Training: ${plan.label} (${plan.focus}) – Dauer: ${mins} Min`
  };
  state.logs.unshift(logEntry);
  saveStorage('dajo_logs', state.logs);
  state.sessionSeconds = 0;
  render();
}

function formatSessionTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

// ─── WEIGHT / PROGRESSION LOGIC ──────────────────────────────────────────────
function getExKey(dayIdx, exIdx) { return `${dayIdx}_${exIdx}`; }

function getLastSession(dayIdx, exIdx) {
  const key = getExKey(dayIdx, exIdx);
  const history = weightLog[key];
  if (!history || history.length === 0) return null;
  return history[history.length - 1];
}

function getTodaySessionSets(dayIdx, exIdx) {
  const key = getExKey(dayIdx, exIdx);
  return (todaySets.sets[key] || []);
}

function shouldIncrease(dayIdx, exIdx, ex) {
  const last = getLastSession(dayIdx, exIdx);
  if (!last || !last.sets || last.sets.length === 0) return false;
  const repsStr = ex.reps;
  const match = repsStr.match(/(\d+)/g);
  if (!match) return false;
  const targetReps = parseInt(match[match.length - 1]);
  const allHitTarget = last.sets.every(s => parseInt(s.r) >= targetReps);
  const enoughSets = last.sets.length >= ex.sets;
  return allHitTarget && enoughSets;
}

function logSet(dayIdx, exIdx, weight, reps) {
  const key = getExKey(dayIdx, exIdx);
  const sets = todaySets.sets[key] || [];
  sets.push({ w: weight, r: reps });
  todaySets.sets[key] = sets;
  saveStorage('dajo_today_sets', todaySets);
}

function saveSessionToHistory(dayIdx, exIdx) {
  const key = getExKey(dayIdx, exIdx);
  const sets = todaySets.sets[key];
  if (!sets || sets.length === 0) return;
  const history = weightLog[key] || [];
  history.push({ date: today, sets });
  weightLog[key] = history;
  saveStorage('dajo_weight_log', weightLog);
}

// ─── TIMER (REST) ────────────────────────────────────────────────────────────
function startTimer(seconds, exName) {
  if (state.timerInterval) clearInterval(state.timerInterval);
  if (seconds <= 0) return;
  state.timerActive = true;
  state.timerTotal = seconds;
  state.timerRemaining = seconds;
  state.timerExName = exName;
  renderTimer();
  state.timerInterval = setInterval(() => {
    state.timerRemaining--;
    if (state.timerRemaining <= 0) {
      clearInterval(state.timerInterval);
      state.timerActive = false;
      try { const a = new AudioContext(); const o = a.createOscillator(); const g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(0.3, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.8); o.start(); o.stop(a.currentTime + 0.8); } catch(e){}
      renderTimer();
      render();
    } else {
      renderTimer();
    }
  }, 1000);
  render();
}

function skipTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerActive = false;
  renderTimer();
  render();
}

function renderTimer() {
  const c = document.getElementById('timer-container');
  if (!c) return;
  if (!state.timerActive) { c.innerHTML = ''; return; }
  const r = state.timerRemaining;
  const total = state.timerTotal;
  const pct = r / total;
  const size = 200; const stroke = 8; const radius = (size - stroke * 2) / 2;
  const circ = 2 * Math.PI * radius;
  const offset = circ * (1 - pct);
  const color = r <= 10 ? '#E05252' : r <= 30 ? '#C9A84C' : '#4CAF7D';

  c.innerHTML = `
    <div class="timer-overlay" onclick="">
      <div class="timer-label">PAUSE</div>
      <div class="timer-ex-name">${state.timerExName}</div>
      <div class="timer-circle">
        <svg width="${size}" height="${size}" style="position:absolute;top:0;left:0">
          <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#222" stroke-width="${stroke}"/>
          <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
            transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 0.9s linear,stroke 0.3s"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div class="timer-seconds" style="color:${color}">${r}</div>
        </div>
      </div>
      <button class="timer-skip" onclick="skipTimer()">Überspringen</button>
    </div>`;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getTotals() {
  const meals = state.nutrition.meals || {};
  return Object.values(meals).reduce((t, slot) => {
    Object.values(slot).forEach(item => { if (item) { t.kcal+=item.kcal; t.p+=item.p; t.c+=item.c; t.f+=item.f; } });
    return t;
  }, {kcal:0,p:0,c:0,f:0});
}
function getMealKcal(mId) {
  const slot = (state.nutrition.meals||{})[mId]||{};
  return Object.values(slot).reduce((s,item)=>s+(item?item.kcal:0),0);
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(child=>{
    if(child==null) return;
    if(typeof child==='string'||typeof child==='number') el.appendChild(document.createTextNode(child));
    else el.appendChild(child);
  });
  return el;
}

function Ring(value, max, color, size, label, sub) {
  const r=(size-12)/2, circ=2*Math.PI*r, pct=Math.min(value/max,1), over=value>max, offset=circ*(1-pct);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',size/2);bg.setAttribute('cy',size/2);bg.setAttribute('r',r);
  bg.setAttribute('fill','none');bg.setAttribute('stroke','#333');bg.setAttribute('stroke-width','6');
  const fg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  fg.setAttribute('cx',size/2);fg.setAttribute('cy',size/2);fg.setAttribute('r',r);
  fg.setAttribute('fill','none');fg.setAttribute('stroke',over?'#E05252':color);fg.setAttribute('stroke-width','6');
  fg.setAttribute('stroke-dasharray',circ);fg.setAttribute('stroke-dashoffset',offset);
  fg.setAttribute('stroke-linecap','round');fg.setAttribute('transform',`rotate(-90 ${size/2} ${size/2})`);
  const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
  txt.setAttribute('x','50%');txt.setAttribute('y','50%');txt.setAttribute('text-anchor','middle');
  txt.setAttribute('dominant-baseline','central');txt.setAttribute('fill',over?'#E05252':'#F2F2F2');
  txt.setAttribute('font-size','11');txt.setAttribute('font-weight','800');txt.setAttribute('font-family','monospace');
  txt.textContent=Math.round(value);
  svg.appendChild(bg);svg.appendChild(fg);svg.appendChild(txt);
  return h('div',{class:'ring-wrap'},svg,h('div',{class:'ring-label'},label),sub?h('div',{class:'ring-sub'},sub):null);
}

  // Food Blocks Selector
  c.appendChild(h('div',{class:'card-label',style:'margin:16px 0 8px;'},'LEBENSMITTEL HINZUFÜGEN'));
  const blockTabs = h('div',{class:'block-tabs'});
  Object.entries(FOOD_BLOCKS).forEach(([bKey, bVal]) => {
    const active = state.activeBlock === bKey;
    const tab = h('button',{class:`block-tab ${active?'active':''}`,style:active?`border-color:${bVal.accent};color:${bVal.accent};`:'',onclick:()=>setState({activeBlock:bKey})},
      bVal.label
    );
    blockTabs.appendChild(tab);
  });
  c.appendChild(blockTabs);

  const blockData = FOOD_BLOCKS[state.activeBlock];
  const blockCard = h('div',{class:'card'});
  blockData.items.forEach((food, fIdx) => {
    const fItem = h('div',{class:'food-item'});
    fItem.appendChild(h('div',{},
      h('div',{style:'font-size:13px;font-weight:700;'},food.name),
      h('div',{style:'font-size:11px;color:#555;'},`${food.amount} · ${food.kcal} kcal (P:${food.p} C:${food.c} F:${food.f})`)
    ));
    const addBtn = h('button',{style:`background:${blockData.accent};border:none;color:#000;font-weight:900;font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;`},'+');
    addBtn.onclick = () => {
      if (!state.nutrition.meals[state.activeMeal]) state.nutrition.meals[state.activeMeal] = {};
      const uniqueKey = `${state.activeBlock}_${fIdx}_${Date.now()}`;
      state.nutrition.meals[state.activeMeal][uniqueKey] = food;
      saveStorage('dajo_nutrition_day', state.nutrition);
      setState({});
    };
    fItem.appendChild(addBtn);
    blockCard.appendChild(fItem);
  });
  c.appendChild(blockCard);

  return c;
}

function renderSupps() {
  const c = h('div',{class:'screen'});
  c.appendChild(h('div',{class:'screen-header'},
    h('div',{class:'eyebrow'},'SUPPLEMENTS'),
    h('div',{class:'title'},'Tägliches Protokoll'),
    h('div',{class:'subtitle'},'Kreatin, Vitamine, Recovery'))
  );

  const card = h('div',{class:'card'});
  SUPPS.forEach((s, idx) => {
    const done = (state.suppsDone.items || []).includes(idx);
    const item = h('div',{class:'supp-item',onclick:()=>{
      let items = state.suppsDone.items || [];
      if (done) items = items.filter(i => i !== idx);
      else items.push(idx);
      state.suppsDone.items = items;
      saveStorage('dajo_supps_day', state.suppsDone);
      setState({});
    }},
      h('div',{},
        h('div',{style:`font-size:14px;font-weight:700;${done?'color:#4CAF7D;text-decoration:line-through;':''}`},s.name),
        h('div',{style:'font-size:11px;color:#555;'},`${s.dose} · ${s.time}`)
      ),
      h('div',{style:`width:22px;height:22px;border-radius:6px;border:1.5px solid ${done?'#4CAF7D':'#333'};background:${done?'#4CAF7D':'#111'};display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:12px;`},done?'✓':'')
    );
    card.appendChild(item);
  });
  c.appendChild(card);
  return c;
}

function renderProgress() {
  const c = h('div',{class:'screen'});
  c.appendChild(h('div',{class:'screen-header'},
    h('div',{class:'eyebrow'},'PROGRESSION'),
    h('div',{class:'title'},'Meilensteine & Logs'),
    h('div',{class:'subtitle'},'Weg zur Sakraya-Form'))
  );

  // Stats / Log input card
  const inputCard = h('div',{class:'card'});
  inputCard.appendChild(h('div',{class:'card-label'},'NEUER EINTRAG'));
  const twoCol = h('div',{class:'two-col'});
  
  const wWrap = h('div');
  wWrap.appendChild(h('div',{class:'input-label'},'GEWICHT (kg)'));
  const wInput = h('input',{class:'input-field',type:'number',placeholder:'z.B. 78.5',value:state.weightInput,oninput:(e)=>state.weightInput=e.target.value});
  wWrap.appendChild(wInput);
  twoCol.appendChild(wWrap);

  const kWrap = h('div');
  kWrap.appendChild(h('div',{class:'input-label'},'KFA (%)'));
  const kInput = h('input',{class:'input-field',type:'number',placeholder:'z.B. 14.5',value:state.kfaInput,oninput:(e)=>state.kfaInput=e.target.value});
  kWrap.appendChild(kInput);
  twoCol.appendChild(kWrap);
  inputCard.appendChild(twoCol);

  inputCard.appendChild(h('div',{class:'input-label'},'NOTIZ / REFLEKTION'));
  const noteInput = h('input',{class:'input-field',type:'text',placeholder:'Wie lief das Training?',style:'margin-bottom:12px;',value:state.noteInput,oninput:(e)=>state.noteInput=e.target.value});
  inputCard.appendChild(noteInput);

  const saveBtn = h('button',{class:`btn-primary ${state.savedFlash?'btn-saved':''}`},state.savedFlash?'GESPEICHERT!':'Eintrag speichern');
  saveBtn.onclick = () => {
    if(!state.weightInput && !state.noteInput) return;
    const entry = { date: today, weight: state.weightInput, kfa: state.kfaInput, note: state.noteInput };
    state.logs.unshift(entry);
    saveStorage('dajo_logs', state.logs);
    state.weightInput = ''; state.kfaInput = ''; state.noteInput = '';
    state.savedFlash = true;
    setState({});
    setTimeout(() => { state.savedFlash = false; setState({}); }, 1200);
  };
  inputCard.appendChild(saveBtn);
  c.appendChild(inputCard);

  // Milestones Card
  const mCard = h('div',{class:'card'});
  mCard.appendChild(h('div',{class:'card-label'},'TRANSFORMATIONS-MEILENSTEINE'));
  MILESTONES.forEach((m, idx) => {
    const item = h('div',{class:'milestone-item'});
    item.appendChild(h('div',{class:'milestone-bar',style:`background:${idx===0?'#C9A84C':'#333'};`}));
    const textWrap = h('div');
    textWrap.appendChild(h('div',{class:'flex-between'},
      h('div',{style:'font-size:14px;font-weight:800;'},m.label),
      h('span',{class:'tag',style:'background:#222;color:#999;'},m.target)
    ));
    textWrap.appendChild(h('div',{style:'font-size:12px;color:#555;margin-top:2px;'},m.desc));
    item.appendChild(textWrap);
    mCard.appendChild(item);
  });
  c.appendChild(mCard);

  // History Logs
  if (state.logs.length > 0) {
    const lCard = h('div',{class:'card'});
    lCard.appendChild(h('div',{class:'card-label'},'VERGANGENE EINTRÄGE'));
    state.logs.forEach(l => {
      const entry = h('div',{class:'log-entry'});
      const left = h('div');
      left.appendChild(h('div',{style:'font-size:12px;font-weight:700;'},l.date));
      if(l.weight) left.appendChild(h('div',{style:'font-size:11px;color:#C9A84C;'},`${l.weight} kg${l.kfa?' · '+l.kfa+'% KFA':''}`));
      if(l.note) left.appendChild(h('div',{style:'font-size:11px;color:#777;margin-top:2px;'},l.note));
      if(l.text) left.appendChild(h('div',{style:'font-size:11px;color:#999;margin-top:2px;'},l.text));
      entry.appendChild(left);
      lCard.appendChild(entry);
    });
    c.appendChild(lCard);
  }

  return c;
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
const TABS = [
  {id:'home', icon:'⚡', label:'HEUTE', render:renderHome},
  {id:'training', icon:'🏋️', label:'TRAINING', render:renderTraining},
  {id:'nutrition', icon:'🥗', label:'ERNÄHRUNG', render:renderNutrition},
  {id:'supps', icon:'💊', label:'SUPPS', render:renderSupps},
  {id:'progress', icon:'📈', label:'PROGRESS', render:renderProgress},
];

function renderNav() {
  const nav = h('nav',{class:'nav-bar'});
  TABS.forEach(t => {
    const active = state.tab === t.id;
    const btn = h('button',{class:'nav-item',onclick:()=>setState({tab:t.id})},
      h('div',{class:'nav-icon',style:active?'opacity:1;':'opacity:0.3;'},t.icon),
      h('div',{class:'nav-text',style:active?'color:#C9A84C;':'color:#555;'},t.label),
      active ? h('div',{class:'nav-dot'}) : h('div',{style:'width:18px;height:2px;background:transparent;'})
    );
    nav.appendChild(btn);
  });
  return nav;
}

// ─── MAIN RENDER LOOP ────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  
  const currentTabObj = TABS.find(t => t.id === state.tab) || TABS[0];
  app.appendChild(currentTabObj.render());
  app.appendChild(renderNav());
  
  renderTimer();
}

render();
</script>
</body>
</html>
