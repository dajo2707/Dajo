<style>
  :root{
    --bg:#0A0D0A;
    --bg-glow: radial-gradient(1100px 480px at 50% -12%, rgba(111,169,138,0.10), transparent 60%);
    --panel:#12160F;
    --panel-2:#161C14;
    --panel-border: rgba(255,255,255,0.07);
    --hairline: rgba(255,255,255,0.08);
    --forest:#1C2C21;
    --forest-deep:#0F1811;
    --cream:#F3EEE2;
    --gold:#C9A369;
    --gold-soft: rgba(201,163,105,0.14);
    --gold-line: rgba(201,163,105,0.35);
    --text:#F2F0EA;
    --text-dim:#9A9C93;
    --text-faint:#5B5D55;
    --green:#6FA98A;
    --blue:#7FA9CC;
    --coral:#D08F6C;
    --danger:#E0685A;
    --radius-lg:20px;
    --radius-md:16px;
    --radius-sm:10px;
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:-apple-system, 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); overscroll-behavior-y: contain; }
  body {
    background: var(--bg-glow), var(--bg);
    color: var(--text); font-family: var(--sans);
    max-width: 430px; margin: 0 auto; min-height: 100vh; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button { font-family: inherit; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }
  .screen { padding: 0 18px; padding-bottom: 110px; min-height: 100vh; }
  .screen-header { padding: calc(50px + env(safe-area-inset-top)) 0 22px; }
  .eyebrow { font-size: 10.5px; letter-spacing: 3.5px; color: var(--text-faint); text-transform: uppercase; display:flex; align-items:center; }
  .eyebrow::before { content:''; display:inline-block; width:5px; height:5px; background:var(--gold); transform:rotate(45deg); margin-right:9px; flex-shrink:0; }
  .title { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -0.4px; color: var(--text); margin-top: 6px; line-height:1.15; }
  .title em { font-style: italic; font-weight: 500; color: var(--gold); }
  .subtitle { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .card { background: linear-gradient(160deg, rgba(255,255,255,0.035), rgba(255,255,255,0.006)), var(--panel); border-radius: var(--radius-lg); padding: 18px; border: 1px solid var(--panel-border); margin-bottom: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.045), 0 14px 34px -26px rgba(0,0,0,0.75); }
  .card-label { font-size: 10px; letter-spacing: 2.6px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 14px; }
  .tag { font-size: 9px; letter-spacing: 2px; font-weight: 800; padding: 4px 9px; border-radius: 5px; text-transform: uppercase; display: inline-block; }
  .btn-primary { width: 100%; padding: 15px; border-radius: var(--radius-sm); border: none; background: linear-gradient(160deg,#DBBA83,var(--gold)); color: #14170F; font-size: 14px; font-weight: 800; cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.2px; }
  .btn-primary:active { opacity: 0.82; }
  .btn-saved { background: linear-gradient(160deg,#8FCBA8,#4E9370) !important; color:#0D1710 !important; }
  .btn-ghost { width:100%; padding:12px; border-radius: var(--radius-sm); border:1px solid var(--panel-border); background:transparent; color:var(--text-dim); font-size:13px; font-weight:700; cursor:pointer; }
  .pill-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .pill { flex: 0 0 auto; padding: 10px 15px; border-radius: var(--radius-sm); border: 1px solid var(--panel-border); background: var(--panel); color: var(--text-faint); cursor: pointer; font-size: 12px; font-weight: 800; white-space: nowrap; transition: all 0.15s; }
  .pill.active { border-width: 1.5px; }
  .exercise-item { background: var(--panel); border-radius: var(--radius-md); padding: 15px 17px; border: 1px solid var(--panel-border); margin-bottom: 9px; transition: all 0.15s; }
  .exercise-item.done { background: rgba(111,169,138,0.07); border-color: rgba(111,169,138,0.4); border-width: 1.5px; }
  .food-item { padding: 13px 15px; border-radius: var(--radius-sm); border: 1px solid var(--panel-border); background: var(--panel); margin-bottom: 7px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; }
  .food-item.selected { border-width: 1.5px; }
  .supp-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; cursor: pointer; }
  .supp-item + .supp-item { border-top: 1px solid var(--hairline); }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .ring-label { font-size: 10px; color: var(--text-faint); text-align: center; letter-spacing: 1px; }
  .ring-sub { font-size: 9px; color: var(--text-faint); opacity:0.7; }
  .input-field { width: 100%; background: #0E1210; border: 1px solid var(--panel-border); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text); font-size: 14px; outline: none; }
  .input-field::placeholder { color: var(--text-faint); }
  .input-label { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }
  .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(16,20,15,0.86); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid var(--hairline); display: flex; padding: 10px 0 max(16px, env(safe-area-inset-bottom)); z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px 0; }
  .nav-icon { font-size: 19px; transition: opacity 0.15s; }
  .nav-text { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; }
  .nav-dot { width: 16px; height: 2px; background: var(--gold); border-radius: 1px; }
  .week-strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
  .week-day { flex: 0 0 auto; width: 46px; text-align: center; padding: 10px 0; border-radius: var(--radius-sm); border: 1px solid var(--panel-border); background: var(--panel); cursor: default; transition: all 0.15s; }
  .week-day.active { border: 1.5px solid var(--gold); background: var(--gold-soft); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-bottom: 14px; }
  .stat-card { background: var(--panel); border-radius: var(--radius-md); padding: 14px 12px; border: 1px solid var(--panel-border); }
  .log-entry { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
  .log-entry + .log-entry { border-top: 1px solid var(--hairline); }
  .milestone-item { display: flex; gap: 14px; padding-bottom: 15px; margin-bottom: 15px; }
  .milestone-item + .milestone-item { border-top: 1px solid var(--hairline); padding-top: 15px; margin-top: 0; }
  .milestone-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
  .macro-rings { display: flex; justify-content: space-around; margin-bottom: 4px; }
  .selected-meal-item { display: flex; justify-content: space-between; padding: 9px 11px; background: #0E1210; border-radius: var(--radius-sm); margin-bottom: 6px; }
  .block-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .block-tab { flex: 1; padding: 9px 4px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 800; border: 1px solid var(--panel-border); background: var(--panel); cursor: pointer; transition: all 0.15s; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .warmup-box { margin-top: 15px; padding: 13px; background: #0E1210; border-radius: var(--radius-sm); }
  .cardio-box { background: var(--panel); border-radius: var(--radius-md); padding: 17px; border: 1px solid var(--panel-border); }
  .progress-bar-simple { background: rgba(255,255,255,0.08); border-radius: 3px; height: 4px; margin-top: 10px; overflow:hidden; }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .flex-center { display: flex; align-items: center; }
  .icon-btn { width:30px; height:30px; border-radius:9px; border:1px solid var(--panel-border); background:#0E1210; color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0; }
  .empty-state { text-align:center; padding: 26px 10px; }
  .empty-state .glyph { width:34px; height:34px; margin:0 auto 12px; border-radius:50%; border:1px solid var(--panel-border); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:14px; font-family:var(--serif); }
  .empty-state .msg { font-size:12.5px; color:var(--text-dim); line-height:1.5; }

  /* TIMER OVERLAY */
  .timer-overlay { position: fixed; inset: 0; background: rgba(6,8,6,0.94); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer-circle { width: 200px; height: 200px; position: relative; margin-bottom: 24px; }
  .timer-label { font-size: 12px; letter-spacing: 3.5px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 12px; }
  .timer-seconds { font-size: 62px; font-weight: 700; color: var(--text); font-family: var(--serif); }
  .timer-ex-name { font-size: 15px; color: var(--gold); font-weight: 600; font-family: var(--serif); margin-bottom: 32px; text-align:center; padding:0 30px; }
  .timer-skip { padding: 14px 40px; border-radius: var(--radius-sm); border: 1px solid var(--panel-border); background: var(--panel); color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(6,8,6,0.88); z-index: 150; display: flex; align-items: flex-end; }
  .modal-sheet { background: var(--panel-2); border-radius: 22px 22px 0 0; padding: 26px 20px calc(36px + env(safe-area-inset-bottom)); width: 100%; border-top:1px solid var(--panel-border); max-height:85vh; overflow-y:auto; }
  .modal-title { font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: var(--text-faint); margin-bottom: 20px; }
  .set-input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .set-input-wrap { display: flex; flex-direction: column; gap: 6px; }
  .set-input { width: 100%; background: #0E1210; border: 1px solid var(--panel-border); border-radius: var(--radius-sm); padding: 14px; color: var(--text); font-size: 22px; font-weight: 700; text-align: center; outline: none; font-family: var(--serif); }
  .set-input::placeholder { color: var(--text-faint); font-size: 18px; }
  .prev-hint { font-size: 11px; color: var(--gold); text-align: center; margin-bottom: 16px; min-height: 16px; }
  .prog-hint { font-size: 12px; color: var(--green); background: rgba(111,169,138,0.1); border: 1px solid rgba(111,169,138,0.3); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 16px; text-align: center; font-weight: 700; }

  .set-history { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .set-badge { font-size: 11px; font-family: var(--sans); background: #0E1210; border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 8px; color: var(--text-dim); }
  .set-badge.current { border-color: var(--gold-line); color: var(--gold); }

  .prog-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; color: var(--green); background: rgba(111,169,138,0.14); border: 1px solid rgba(111,169,138,0.32); border-radius: 6px; padding: 3px 7px; margin-left: 6px; }
  .custom-badge { font-size: 9px; font-weight: 800; letter-spacing: 1px; color: var(--gold); background: var(--gold-soft); border-radius: 5px; padding: 2px 6px; margin-left: 6px; text-transform:uppercase; }
  .streak-flame { font-family: var(--serif); }
  .form-field { margin-bottom: 12px; }
  .file-input-hidden { display:none; }
  .chart-svg-wrap { width:100%; }
</style>
</head>

<script>
// ─── STORAGE ─────────────────────────────────────────────────────────────────
function loadStorage(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function saveStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─── STATE ───────────────────────────────────────────────────────────────────

const today = new Date().toDateString();

let suppsDayData = loadStorage('dajo_supps_day', { date: '', items: [] });
if (suppsDayData.date !== today) { suppsDayData = { date: today, items: [] }; saveStorage('dajo_supps_day', suppsDayData); }

let nutritionDayData = loadStorage('dajo_nutrition_day', { date: '', meals: {} });
if (nutritionDayData.date !== today) { nutritionDayData = { date: today, meals: {} }; saveStorage('dajo_nutrition_day', nutritionDayData); }

let weightLog = loadStorage('dajo_weight_log', {});
let todaySets = loadStorage('dajo_today_sets', { date: '', sets: {} });
if (todaySets.date !== today) { todaySets = { date: today, sets: {} }; saveStorage('dajo_today_sets', todaySets); }

let suppHistory = loadStorage('dajo_supp_history', {});
let customFoods = loadStorage('dajo_custom_foods', { protein: [], carbs: [], fat: [], veg: [] });
let customExercises = loadStorage('dajo_custom_exercises', {});

  const d = new Date().getDay(); return d === 0 ? 6 : d - 1;

// ─── EXERCISE HELPERS (inkl. eigene Übungen & Overrides) ────────────────────
function getPlanExercises(dayIdx) {
  const base = WEEK_PLAN[dayIdx].exercises.map((ex,i)=>({...ex, _key:`${i}`, custom:false}));
  const customs = (customExercises[dayIdx]||[]).map((ex,i)=>({...ex, _key:`c${i}`, custom:true}));
  return [...base, ...customs];
}
function getEffectiveExercise(dayIdx, key, baseEx) {
  const ov = exerciseOverrides[`${dayIdx}_${key}`];
  return ov ? {...baseEx, ...ov} : baseEx;
}
function removeCustomExercise(dayIdx, customIdx) {
  const list = customExercises[dayIdx]||[];
  list.splice(customIdx,1);
  customExercises[dayIdx]=list;
  saveStorage('dajo_custom_exercises', customExercises);
  render();
}

// ─── WEIGHT / PROGRESSION LOGIC ──────────────────────────────────────────────
function getExKey(dayIdx, key) { return `${dayIdx}_${key}`; }

function getLastSession(dayIdx, key) {
  const k = getExKey(dayIdx, key);
  const history = weightLog[k];
  if (!history || history.length === 0) return null;
  return history[history.length - 1];
}
function getTodaySessionSets(dayIdx, key) {
  const k = getExKey(dayIdx, key);
  return (todaySets.sets[k] || []);
}
function shouldIncrease(dayIdx, key, ex) {
  const last = getLastSession(dayIdx, key);
  if (!last || !last.sets || last.sets.length === 0) return false;
  const repsStr = ex.reps;
  const match = repsStr.match(/(\d+)/g);
  if (!match) return false;
  const targetReps = parseInt(match[match.length - 1]);
  const allHitTarget = last.sets.every(s => parseInt(s.r) >= targetReps);
  const enoughSets = last.sets.length >= ex.sets;
  return allHitTarget && enoughSets;
}
function logSet(dayIdx, key, weight, reps) {
  const k = getExKey(dayIdx, key);
  const sets = todaySets.sets[k] || [];
  sets.push({ w: weight, r: reps });
  todaySets.sets[k] = sets;
  saveStorage('dajo_today_sets', todaySets);
}
function saveSessionToHistory(dayIdx, key) {
  const k = getExKey(dayIdx, key);
  const sets = todaySets.sets[k];
  if (!sets || sets.length === 0) return;
  const history = weightLog[k] || [];
  history.push({ date: today, sets });
  weightLog[k] = history;
  saveStorage('dajo_weight_log', weightLog);
}

// ─── STREAK ──────────────────────────────────────────────────────────────────
function updateSuppHistory() {
  const done = (state.suppsDone.items||[]).length === SUPPS.length;
  suppHistory[today] = done;
  saveStorage('dajo_supp_history', suppHistory);
}
function computeStreak() {
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = cursor.toDateString();
    if (suppHistory[key]) { streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

const BACKUP_KEYS = ['dajo_supps_day','dajo_nutrition_day','dajo_weight_log','dajo_today_sets','dajo_logs','dajo_supp_history','dajo_custom_foods','dajo_custom_exercises','dajo_exercise_overrides','dajo_targets'];
function exportData() {
  const data = {};
  BACKUP_KEYS.forEach(k => { data[k] = loadStorage(k, null); });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dajo-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importDataFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      BACKUP_KEYS.forEach(k => { if (data[k] !== undefined && data[k] !== null) saveStorage(k, data[k]); });
      location.reload();
    } catch (err) { alert('Ungültige Backup-Datei.'); }
  };
  reader.readAsText(file);
}

// ─── TIMER ───────────────────────────────────────────────────────────────────
function startTimer(seconds, exName) {
  if (state.timerInterval) clearInterval(state.timerInterval);
  if (seconds <= 0) return;
  state.timerActive = true;
  state.timerTotal = seconds;
  state.timerRemaining = seconds;
  state.timerExName = exName;
  renderTimer();
  state.timerInterval = setInterval(() => {
    state.timerRemaining--;
    if (state.timerRemaining <= 0) {
      clearInterval(state.timerInterval);
      state.timerActive = false;
      try { const a = new AudioContext(); const o = a.createOscillator(); const g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(0.3, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.8); o.start(); o.stop(a.currentTime + 0.8); } catch(e){}
      renderTimer();
      render();
    } else {
      renderTimer();
    }
  }, 1000);
  render();
}
function skipTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerActive = false;
  renderTimer();
  render();
}
function renderTimer() {
  const c = document.getElementById('timer-container');
  if (!c) return;
  if (!state.timerActive) { c.innerHTML = ''; return; }
  const r = state.timerRemaining;
  const total = state.timerTotal;
  const pct = r / total;
  const size = 200; const stroke = 7; const radius = (size - stroke * 2) / 2;
  const circ = 2 * Math.PI * radius;
  const offset = circ * (1 - pct);
  const color = r <= 10 ? 'var(--danger)' : r <= 30 ? 'var(--gold)' : 'var(--green)';

  c.innerHTML = `
    <div class="timer-overlay">
      <div class="timer-label">Pause</div>
      <div class="timer-ex-name">${state.timerExName}</div>
      <div class="timer-circle">
        <svg width="${size}" height="${size}" style="position:absolute;top:0;left:0">
          <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}"/>
          <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
            transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 0.9s linear,stroke 0.3s"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div class="timer-seconds" style="color:${color}">${r}</div>
        </div>
      </div>
      <button class="timer-skip" onclick="skipTimer()">Überspringen</button>
    </div>`;
}

function getTotals() {
  const meals = state.nutrition.meals || {};
  return Object.values(meals).reduce((t, slot) => {
    Object.values(slot).forEach(item => { if (item) { t.kcal+=item.kcal; t.p+=item.p; t.c+=item.c; t.f+=item.f; } });
    return t;
  }, {kcal:0,p:0,c:0,f:0});
}
function getMealKcal(mId) {
  const slot = (state.nutrition.meals||{})[mId]||{};
  return Object.values(slot).reduce((s,item)=>s+(item?item.kcal:0),0);
}
function getBlockItems(blockKey) {
  return [...FOOD_BLOCKS[blockKey].items, ...(customFoods[blockKey]||[])];
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(child=>{
    if(child==null) return;
    if(typeof child==='string'||typeof child==='number') el.appendChild(document.createTextNode(child));
    else el.appendChild(child);
  });
  return el;
}

function Ring(value, max, gradId, size, label, sub) {
  const r=(size-12)/2, circ=2*Math.PI*r, pct=Math.min(value/max,1), over=value>max, offset=circ*(1-pct);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',size); svg.setAttribute('height',size);
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',size/2);bg.setAttribute('cy',size/2);bg.setAttribute('r',r);
  bg.setAttribute('fill','none');bg.setAttribute('stroke','rgba(255,255,255,0.08)');bg.setAttribute('stroke-width','6');
  const fg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  fg.setAttribute('cx',size/2);fg.setAttribute('cy',size/2);fg.setAttribute('r',r);
  fg.setAttribute('fill','none'); fg.style.stroke = over ? 'var(--danger)' : `url(#${gradId})`; fg.setAttribute('stroke-width','6');
  fg.setAttribute('stroke-dasharray',circ);fg.setAttribute('stroke-dashoffset',offset);
  fg.setAttribute('stroke-linecap','round');fg.setAttribute('transform',`rotate(-90 ${size/2} ${size/2})`);
  const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
  txt.setAttribute('x','50%');txt.setAttribute('y','50%');txt.setAttribute('text-anchor','middle');
  txt.setAttribute('dominant-baseline','central'); txt.style.fill = over ? 'var(--danger)' : 'var(--text)';
  txt.setAttribute('font-size','11');txt.setAttribute('font-weight','700');txt.setAttribute('font-family','var(--sans)');
  txt.textContent=Math.round(value);
  svg.appendChild(bg);svg.appendChild(fg);svg.appendChild(txt);
  return h('div',{class:'ring-wrap'},svg,h('div',{class:'ring-label'},label),sub?h('div',{class:'ring-sub'},sub):null);
}

function WeightChart(logs) {
  if (!logs || logs.length < 2) return null;
  const chrono = [...logs].reverse().slice(-14);
  const weights = chrono.map(l=>l.weight);
  const width=294, height=110, pad=14;
  const min=Math.min(...weights), max=Math.max(...weights);
  const range=(max-min)||1;
  const stepX = (width-pad*2)/(chrono.length-1);
  const pts = chrono.map((l,i)=>[pad+i*stepX, height-pad-((l.weight-min)/range)*(height-pad*2)]);
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(1)},${height-pad} L${pts[0][0].toFixed(1)},${height-pad} Z`;
  const last = pts[pts.length-1];
  const wrap = document.createElement('div');
  wrap.className = 'chart-svg-wrap';
  wrap.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <defs>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C9A369" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#C9A369" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#chartFill)"/>
      <path d="${pathD}" fill="none" stroke="#C9A369" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="#F3EEE2" stroke="#C9A369" stroke-width="2"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-faint);margin-top:4px">
      <span>${chrono[0].date}</span><span>${max}kg</span><span>${min}kg</span><span>${chrono[chrono.length-1].date}</span>
    </div>`;
  return wrap;
}

  const startWeight=83,startKfa=17.5;
  const latestW=logs[0]?.weight||startWeight, latestK=logs[0]?.kfa||startKfa;
  const wDiff=+(latestW-startWeight).toFixed(1), kDiff=+(latestK-startKfa).toFixed(1);
  const chart = WeightChart(logs);

  return h('div',{class:'screen'},
    h('div',{class:'screen-header'},
      h('div',{class:'eyebrow'},'Fortschritt'),
      h('div',{class:'title'},'Tracker')
    ),
    h('div',{style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px'},
      ...[
        {label:'GEWICHT',value:`${latestW}`,unit:'kg',diff:wDiff},
        {label:'KFA',value:`${latestK}`,unit:'%',diff:kDiff},
        {label:'EINTRÄGE',value:`${logs.length}`,unit:'',diff:null},
      ].map(s=>h('div',{class:'stat-card',style:'text-align:center'},
        h('div',{style:'font-size:9px;color:var(--text-faint);letter-spacing:1px;margin-bottom:6px'},s.label),
        h('div',{style:'font-size:20px;font-weight:700;color:var(--text);font-family:var(--serif)'},s.value,h('span',{style:'font-size:11px;color:var(--text-faint)'},s.unit)),
        s.diff!==null&&s.diff!==0?h('div',{style:`font-size:11px;color:${s.diff<0?'var(--green)':'var(--danger)'};margin-top:4px`},`${s.diff>0?'+':''}${s.diff}${s.unit}`):null
      ))
    ),
    chart?h('div',{class:'card'},h('div',{class:'card-label'},'GEWICHTSVERLAUF'),chart):null,
    h('div',{class:'card'},
      h('div',{class:'card-label'},'EINTRAG HINZUFÜGEN'),
      h('div',{class:'two-col'},
        h('div',{},h('div',{class:'input-label'},'Gewicht (kg)'),h('input',{class:'input-field',type:'number',placeholder:'83.0',value:state.weightInput,onInput:e=>{state.weightInput=e.target.value;}})),
        h('div',{},h('div',{class:'input-label'},'KFA (%)'),h('input',{class:'input-field',type:'number',placeholder:'17.5',value:state.kfaInput,onInput:e=>{state.kfaInput=e.target.value;}}))
      ),
      h('div',{style:'margin-bottom:12px'},h('div',{class:'input-label'},'Notiz (optional)'),h('input',{class:'input-field',placeholder:'Wie fühlst du dich heute?',value:state.noteInput,onInput:e=>{state.noteInput=e.target.value;}})),
      h('button',{class:`btn-primary${state.savedFlash?' btn-saved':''}`,onClick:()=>{
        if(!state.weightInput) return;
        const entry={date:new Date().toLocaleDateString('de-DE'),weight:parseFloat(state.weightInput),kfa:parseFloat(state.kfaInput)||null,note:state.noteInput};
        state.logs=[entry,...state.logs]; saveStorage('dajo_logs',state.logs);
        state.weightInput='';state.kfaInput='';state.noteInput='';state.savedFlash=true;render();
        setTimeout(()=>{state.savedFlash=false;render();},2000);
      }},state.savedFlash?'✓ Gespeichert':'Eintrag speichern')
    ),
    h('div',{class:'card'},
      h('div',{class:'card-label'},'ROADMAP ZUM ZIEL'),
      ...MILESTONES.map((m,i)=>h('div',{class:'milestone-item'},
        h('div',{class:'milestone-bar',style:`background:${i===0?'var(--gold)':'rgba(255,255,255,0.12)'}`}),
        h('div',{},
          h('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:4px'},
            h('span',{style:`font-size:13px;font-weight:700;color:${i===0?'var(--gold)':'var(--text)'};font-family:var(--serif)`},m.label),
            h('span',{class:'tag',style:`color:${i===0?'var(--gold)':'var(--text-faint)'};background:${i===0?'var(--gold-soft)':'rgba(255,255,255,0.05)'}`},m.target)
          ),
          h('div',{style:'font-size:12px;color:var(--text-dim)'},m.desc)
        )
      ))
    ),
    logs.length>0?h('div',{class:'card'},
      h('div',{class:'card-label'},'VERLAUF'),
      ...logs.slice(0,10).map(l=>h('div',{class:'log-entry'},
        h('div',{},h('div',{style:'font-size:13px;font-weight:700;color:var(--text)'},l.date),l.note?h('div',{style:'font-size:11px;color:var(--text-faint);margin-top:2px'},l.note):null),
        h('div',{style:'text-align:right'},h('div',{style:'font-size:13px;font-weight:700;color:var(--text)'},`${l.weight} kg`),l.kfa?h('div',{style:'font-size:11px;color:var(--text-faint)'},`${l.kfa}% KFA`):null)
      ))
    ):EmptyState('Noch keine Einträge — leg deinen ersten Wert oben an.','+'),
    h('div',{class:'card'},
      h('div',{class:'card-label'},'DATEN & BACKUP'),
      h('div',{style:'font-size:12px;color:var(--text-dim);margin-bottom:14px;line-height:1.5'},'Alle Daten liegen nur lokal auf diesem Gerät. Exportiere regelmäßig ein Backup, um nichts zu verlieren.'),
      h('div',{style:'display:flex;gap:10px'},
        h('button',{class:'btn-ghost',style:'flex:1',onClick:()=>exportData()},'Exportieren'),
        h('button',{class:'btn-ghost',style:'flex:1',onClick:()=>document.getElementById('import-file-input').click()},'Importieren')
      ),
      h('input',{type:'file',accept:'application/json',id:'import-file-input',class:'file-input-hidden',onChange:e=>importDataFile(e.target.files[0])})
    )
  );
}

function renderNav() {
  const items=[{id:'home',icon:'⌂',label:'Heute'},{id:'training',icon:'◈',label:'Training'},{id:'nutrition',icon:'◉',label:'Ernährung'},{id:'progress',icon:'▲',label:'Fortschritt'}];
  return h('nav',{class:'nav-bar'},...items.map(item=>
    h('button',{class:'nav-item',onClick:()=>setState({tab:item.id})},
      h('span',{class:'nav-icon',style:`opacity:${state.tab===item.id?1:0.35};color:${state.tab===item.id?'var(--gold)':'var(--text)'}`},item.icon),
      h('span',{class:'nav-text',style:`color:${state.tab===item.id?'var(--gold)':'var(--text-faint)'}`},item.label),
      state.tab===item.id?h('div',{class:'nav-dot'}):null
    )
  ));
}

function render() {
  const app=document.getElementById('app');
  app.innerHTML='';
  let screen;
  if(state.tab==='home') screen=renderHome();
  else if(state.tab==='training') screen=renderTraining();
  else if(state.tab==='nutrition') screen=renderNutrition();
  else screen=renderProgress();
  app.appendChild(screen);
  app.appendChild(renderNav());
}

render();

// ─── PWA: Service Worker Registrierung ───────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
